name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Audit live URL
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: 'https://patcher.xyz/'
          uploadArtifacts: true
          artifactName: report
