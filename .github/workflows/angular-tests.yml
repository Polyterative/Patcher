name: Angular Tests

on:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'api/**'
      - 'middleware.ts'
      - 'generate-env.js'
      - 'scripts/**'
      - 'vercel.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'angular.json'
      - 'tsconfig*.json'
      - '.github/workflows/angular-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'api/**'
      - 'middleware.ts'
      - 'generate-env.js'
      - 'scripts/**'
      - 'vercel.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'angular.json'
      - 'tsconfig*.json'
      - '.github/workflows/angular-tests.yml'
  workflow_dispatch:

concurrency:
  group: angular-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: pnpm run lint
          - name: Stylelint
            command: pnpm run lint:styles
          - name: Unit tests
            command: pnpm run ci
          - name: Function tests
            command: pnpm run test:functions
          - name: Production build + smoke
            command: pnpm run build && pnpm run test:e2e:prod:run
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate environment files
        run: node generate-env.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # Cache the Chromium binary used by the prod smoke step. Keyed by the
      # Playwright version in the lockfile so cache invalidates only on
      # version bumps. Saves ~30s per run vs. re-downloading.
      - name: Cache Playwright browsers
        if: matrix.name == 'Production build + smoke'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: matrix.name == 'Production build + smoke'
        # Skip --with-deps: ubuntu-latest already has Chromium's system libs,
        # and --with-deps shells out to apt-get for another ~30s.
        run: pnpm exec playwright install chromium

      - name: Run checks
        run: ${{ matrix.command }}

  deploy-preview:
    name: Deploy Vercel preview
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: vercel-preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify Vercel credentials
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Pull Vercel preview environment
        run: pnpm dlx vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Deploy Vercel preview
        id: deploy
        run: |
          set -euo pipefail
          deployment_output="$(pnpm dlx vercel@latest deploy --yes --target=preview --token="$VERCEL_TOKEN")"
          printf '%s\n' "$deployment_output"
          deployment_url="$(printf '%s\n' "$deployment_output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app[^[:space:]]*' | tail -n 1)"
          if [ -z "$deployment_url" ]; then
            echo "Could not determine Vercel preview URL from deploy output." >&2
            exit 1
          fi
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"
          echo "Preview deployed to ${deployment_url}"

  deploy-production:
    name: Deploy Vercel production
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: vercel-production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify Vercel credentials
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Pull Vercel production environment
        run: pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy Vercel production
        id: deploy
        run: |
          set -euo pipefail
          deployment_output="$(pnpm dlx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN")"
          printf '%s\n' "$deployment_output"
          deployment_url="$(printf '%s\n' "$deployment_output" | grep -Eo 'https://[^[:space:]]+' | tail -n 1)"
          if [ -z "$deployment_url" ]; then
            echo "Could not determine Vercel production URL from deploy output." >&2
            exit 1
          fi
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"
          echo "Production deployed to ${deployment_url}"
