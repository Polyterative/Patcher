name: Angular Tests

on:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'api/**'
      - 'middleware.ts'
      - 'scripts/tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'angular.json'
      - 'tsconfig*.json'
      - '.github/workflows/angular-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'api/**'
      - 'middleware.ts'
      - 'scripts/tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'angular.json'
      - 'tsconfig*.json'
      - '.github/workflows/angular-tests.yml'
  workflow_dispatch:

concurrency:
  group: angular-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit tests
            command: pnpm run ci
          - name: Function tests
            command: pnpm run test:functions
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate environment files
        run: node generate-env.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Run tests
        run: ${{ matrix.command }}
