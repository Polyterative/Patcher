name: Angular Tests

on:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'api/**'
      - 'middleware.ts'
      - 'generate-env.js'
      - 'scripts/**'
      - 'vercel.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'angular.json'
      - 'tsconfig*.json'
      - '.github/workflows/angular-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'api/**'
      - 'middleware.ts'
      - 'generate-env.js'
      - 'scripts/**'
      - 'vercel.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'angular.json'
      - 'tsconfig*.json'
      - '.github/workflows/angular-tests.yml'
  workflow_dispatch:

concurrency:
  group: angular-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: pnpm run lint
          - name: Stylelint
            command: pnpm run lint:styles
          - name: Unit tests
            command: pnpm run ci
          - name: Function tests
            command: pnpm run test:functions
          - name: Production build + smoke
            command: pnpm run build && pnpm run test:e2e:prod:run
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate environment files
        run: node generate-env.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # Cache the Chromium binary used by the prod smoke step. Keyed by the
      # Playwright version in the lockfile so cache invalidates only on
      # version bumps. Saves ~30s per run vs. re-downloading.
      - name: Cache Playwright browsers
        if: matrix.name == 'Production build + smoke'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: matrix.name == 'Production build + smoke'
        # Skip --with-deps: ubuntu-latest already has Chromium's system libs,
        # and --with-deps shells out to apt-get for another ~30s.
        run: pnpm exec playwright install chromium

      - name: Run checks
        run: ${{ matrix.command }}
