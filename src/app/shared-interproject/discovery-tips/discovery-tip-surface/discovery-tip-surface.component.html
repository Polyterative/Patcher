@if ((viewModel$ | async); as tip) {
  <div
    class="discovery-tip-highlight"
    [ngStyle]="{
      left: tip.highlight.left + 'px',
      top: tip.highlight.top + 'px',
      width: tip.highlight.width + 'px',
      height: tip.highlight.height + 'px'
    }"
    aria-hidden="true"
  ></div>
  <section
    #tipPanel
    class="discovery-tip"
    [class.above]="tip.side === 'above'"
    [class.below]="tip.side === 'below'"
    [ngStyle]="{
      left: tip.left + 'px',
      top: tip.top + 'px',
      '--tip-arrow-left': tip.arrowLeft + 'px'
    }"
    aria-live="polite"
    role="status"
  >
    <div class="eyebrow">{{ tip.guidedStepLabel ?? 'Helpful tip' }}</div>
    <div class="title">{{ tip.title }}</div>
    <div class="body">{{ tip.body }}</div>
    @if (tip.reason) {
      <details class="reason">
        <summary>Why this?</summary>
        <p>{{ tip.reason }}</p>
      </details>
    }

    <div class="actions">
      @if (tip.isGuided) {
        <button
          class="tertiary-action"
          type="button"
          (click)="discoveryTipService.endGuidedTour()"
        >
          End tour
        </button>
      } @else {
        <button
          class="tertiary-action"
          type="button"
          (click)="discoveryTipService.pauseAllTips()"
        >
          Pause tips
        </button>
        <button
          class="secondary-action"
          type="button"
          (click)="discoveryTipService.startUserAreaTour()"
        >
          Start tour
        </button>
        <button
          class="secondary-action"
          type="button"
          (click)="discoveryTipService.snoozeActiveTip()"
        >
          Later
        </button>
      }
      <button
        class="primary-action"
        type="button"
        (click)="discoveryTipService.acknowledgeActiveTip()"
      >
        {{ tip.isGuided ? (tip.isLastGuidedStep ? 'Done' : 'Next') : 'Got it' }}
      </button>
    </div>
  </section>
}
