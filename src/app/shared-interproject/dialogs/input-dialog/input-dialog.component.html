<h1 mat-dialog-title>{{ title }}</h1>
<mat-dialog-content>
  <div class="col gap1"
  >
    @if (description) {
      <div>
        {{ description }}
      </div>
    }
    <lib-mat-form-entity [dataPack]="fieldConfig"
                         [errorProvider]="appState.globalUtils.errorProvider"
                         (enterPressed)="confirm()"
                         formFieldAppearanceType="outline"
                         style="margin-top: 2rem;"
    ></lib-mat-form-entity>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <div>
    <!--      <app-brand-primary-button (click$)="dialogRef.close({result: undefined})"-->
    <!--                                theme="negative"-->
    <!--      >Cancel-->
    <!--      </app-brand-primary-button>-->
    <app-brand-primary-button (click$)="confirm()"
                              [disabled]="!(isValid$ | async)"
                              theme="positive"
                              icon="check"
                              style="align-self: flex-end;"
    >Confirm
    </app-brand-primary-button>
  
  </div>
</mat-dialog-actions>
