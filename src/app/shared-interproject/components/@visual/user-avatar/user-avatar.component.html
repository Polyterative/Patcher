<lib-clean-card>
  <div class="row gap1"
  >
    @if (name) {
      <div class="layout-column layout-flex-grow layout-gap-1"
      >
        <div class="layout-row layout-flex-full layout-gap-1"
        >
          <div
               class="name layout-flex-grow layout-align-start"
          >
            {{ name }}
          </div>
        </div>
        @if (!hideLogoff) {
          <div class="layout-flex-full layout-align-end"
        >
            <app-brand-primary-button theme="warning"
                                      (click$)="logoff$.emit()"
          >Logoff
            </app-brand-primary-button>
          </div>
        }
      </div>
    } @else {
      <div class="col gap1"
      >
        <app-brand-primary-button
          theme="primary"
          (click$)="login$.emit()"
        >Login
        </app-brand-primary-button>
        <app-brand-primary-button
          theme="primary"
          (click$)="signup$.emit()"
        >Sign up
        </app-brand-primary-button>
      </div>
    }
  
  </div>
</lib-clean-card>
