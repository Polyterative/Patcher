@if (shellVm$ | async; as shellVm) {
  <div class="title-metro-nav"
       [class.title-metro-nav--floating]="floating">
    @if (showBrand && !floating) {
      <div class="title-metro-topbar">
        <a class="title-metro-brand"
           routerLink="/home"
           routerLinkActive="title-metro-brand--active"
           aria-label="Go to home">{{ siteTitle }}</a>
      </div>
    }
    <nav class="title-metro-targets" aria-label="Section targets">
      <div class="title-metro-target-group">
        @for (item of wideShellTargets; track trackByNavLink($index, item)) {
          <a
             class="title-metro-target"
             [class.title-metro-target--active]="isWideShellTargetActive(item, shellVm.currentUrl)"
             [routerLink]="item.route"
             [attr.aria-label]="item.label"
          >
            {{ item.label }}
          </a>
        }
      </div>
      <div class="title-metro-target-group title-metro-target-group--account">
        @for (item of shellVm.accountLinks; track trackByNavLink($index, item)) {
          <a
            class="title-metro-target title-metro-target--private"
            [routerLink]="item.route"
            routerLinkActive="title-metro-target--active"
            [attr.aria-label]="item.label"
          >
            <span>{{ item.label }}</span>
          </a>
        }
      </div>
    </nav>
  </div>
}
