<div class="value-showcase layout-gap-02" [class.layout-column]="valueBelow" [class.layout-row]="!valueBelow"
>
  <div
       class="label layout-flex-grow"
  >{{ label }}</div>
  <div class="layout-flex-full layout-row layout-align-end"
  >
    <div class="layout-flex-full"
         [class]="bigText ? 'value' : null"
    >
      <div class="layout-flex-grow" *ngIf="pushToEnd"
      ></div>
      <ng-content></ng-content>
    </div>
  </div>
</div>
