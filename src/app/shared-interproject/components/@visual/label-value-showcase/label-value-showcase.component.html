<div class="showcase-root">
  <!-- Optional Icon -->
  @if (icon) {
    <div class="icon">
      <mat-icon>{{ icon }}</mat-icon>
    </div>
  }
  <div class="showcase-content"
       [class.showcase-content--column]="valueBelow"
       [class.showcase-content--row]="!valueBelow"
       [class.showcase-content--push-end]="pushToEnd">
    <div class="label">
      {{ label }}
    </div>
    <div class="value-content"
         [class.value-content--push-end]="pushToEnd">
      <div [ngClass]="{'end': pushToEnd, 'value': bigText}">
        <div [ngClass]="{'monospace': monospace}">
          <ng-content></ng-content>
        </div>
      </div>
    </div>
  </div>
</div>
