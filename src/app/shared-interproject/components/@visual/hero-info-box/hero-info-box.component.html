<div class="container"
     fxFlex="100"
     fxLayout="column"
     [@fadeInOut]

>
  <div fxFlex="100"
       fxLayoutAlign="start center"
       class="text"
  >
    <mat-card-subtitle>
      @if ({data: dataService.infoText$|async}; as bag) {
        @if (bag.data && bag.data.length > 0) {
          {{
            bag.data
          }}
        } @else {
          Additional info will appear here
        }
      }
    </mat-card-subtitle>
  </div>

</div>
