<div class="container"
     style="display:flex; flex:1 1 auto; flex-direction:column;"
     [@fadeInOut]
>
  <div class="text"
       style="display:flex; align-items:center;"
  >
    <mat-card-subtitle>
      @if ({data: dataService.infoText$|async}; as bag) {
        @if (bag.data && bag.data.length > 0) {

            bag.data

          Additional info will appear here
        }
      }
    </mat-card-subtitle>
  </div>

</div>
