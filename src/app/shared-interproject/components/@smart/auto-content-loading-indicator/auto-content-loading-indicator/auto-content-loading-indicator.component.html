@if ({
  dataLoading: (dataLoading$|async)
}; as bag) {
  @if (bag.dataLoading) {
    <div class="loading-shell" [attr.aria-label]="loadingLabel" aria-live="polite" role="status">
      <div class="loading-shell__label">{{ loadingLabel }}</div>
      @for (i of [].constructor(loadingLines); track i) {
        <div class="loading-shell__group">
          <div class="loading-shell__line loading-shell__line--primary"></div>
          <div class="loading-shell__line loading-shell__line--secondary"></div>
          <div class="loading-shell__line loading-shell__line--tertiary"></div>
        </div>
      }
    </div>
  }
  @if (!bag.dataLoading) {
    <div [@enter]>
      <ng-content></ng-content>
    </div>
  }
}
