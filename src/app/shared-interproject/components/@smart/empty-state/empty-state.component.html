<div class="empty-state">
  @if (backgroundImage) {
    <div
      class="empty-state__image"
      [ngStyle]='{"background-image": "url("+ this.backgroundImage + ")"}'
      aria-hidden="true"
    ></div>
  }
  @if (!backgroundImage) {
    <div class="empty-state__panel" role="status" aria-live="polite">
      <div class="empty-state__icon-shell" aria-hidden="true">
        <mat-icon class="empty-state__icon">{{ icon }}</mat-icon>
      </div>
      <div class="empty-state__copy">
        <strong>{{ title }}</strong>
        <span>{{ copy }}</span>
      </div>
    </div>
  }
</div>
