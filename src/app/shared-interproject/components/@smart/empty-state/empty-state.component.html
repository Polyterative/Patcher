<div style="padding-top: 4rem">
  @if (backgroundImage) {
    <div fxLayout="column"
         fxLayoutAlign="center center"
    >
      <div fxFlex="100"
           [fxHide.xs]="true"
           style="padding: 8rem 16rem;"
           [ngStyle]='{"background-image": "url("+ this.backgroundImage + ")"}'
           class="bg"
      ></div>
      <div fxFlex="100"
           fxHide="true"
           [fxHide.xs]="false"
           style="padding: 4rem 8rem;"
           [ngStyle]='{"background-image": "url("+ this.backgroundImage + ")"}'
           class="bg"
      ></div>
    </div>
  }
  @if (!backgroundImage) {
    <div fxLayout="column"
         fxLayoutAlign="center center"
    >
    </div>
  }


</div>
