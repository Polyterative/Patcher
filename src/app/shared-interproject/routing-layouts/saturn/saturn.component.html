<lib-screen-wrapper>
  <div class="row gap1 saturn-layout">
    <div class="content saturn-content">
      <ng-container *ngIf="title else content">
        <div class="saturn-content-shell saturn-content-shell--with-title">
          <mat-toolbar
            class="saturn-toolbar"
            style="background-color: #778698"
            color="primary"
            id="navbar"
          >
            <mat-toolbar-row>{{title}}</mat-toolbar-row>
          </mat-toolbar>

          <router-outlet></router-outlet>
        </div>
      </ng-container>

      <ng-template #content>
        <router-outlet></router-outlet>
      </ng-template>
    </div>
    <div class="sidebar saturn-sidebar">
      <div>
        <router-outlet name="user"></router-outlet>
      </div>
      <div>
        <router-outlet name="sidebar"></router-outlet>
      </div>
    </div>
  </div>
</lib-screen-wrapper>
