@if (title) {
  <div fxFlex="100"
       fxLayout="column"
       fxLayoutGap=".5rem"
  >
    <mat-toolbar fxFlex="4rem"
                 style="background-color: #778698"
                 color="primary"
                 id="navbar"
    >
      <mat-toolbar-row>{{title}}</mat-toolbar-row>
    </mat-toolbar>
    <router-outlet></router-outlet>
  </div>
} @else {
  <router-outlet></router-outlet>
}
