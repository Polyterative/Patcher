@if ({
  filteredData:(filteredData$|async),
  data:(data$|async)
}; as bag) {
  @if (bag.data == null) {
    <lib-auto-content-loading-indicator
      [skipFirstData]="true"
      [loadingLines]="5"
    >
    </lib-auto-content-loading-indicator>
  } @else {
    <div class="col gap1">
      @if (showSearch) {
        <div class="row gap1"
        >
          <app-local-data-filter></app-local-data-filter>
        </div>
      }
      <flexbox-row-fast class="limit-height "
      >
        @for (item of (showSearch ? bag.filteredData : bag.data); track item; let i = $index) {
          <lib-clean-card [@enter]="{ value: '', params: { delay: (i * 25)+50}}"
                          [@leave]="{ value: '', params: { delay:  0 }}"
                          class="item"
          >
            <app-rack-micro [data]="item"
                            [viewConfig]="viewConfig"
            ></app-rack-micro>
          </lib-clean-card>
        } @empty {
          <app-empty-state></app-empty-state>
        }
      </flexbox-row-fast>
    </div>
  }
}
