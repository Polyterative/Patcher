@if (data.description) {
  <div class="row space-between description layout-gap-1"
       [class.description--has-reader]="shouldClampDescription"
  >
    <mat-card-subtitle
      #descriptionTrigger
      class="module-description"
      [class.module-description--clamped]="shouldClampDescription"
      [attr.tabindex]="shouldClampDescription ? 0 : null"
      (mouseenter)="updateReaderAlignment(descriptionTrigger)"
      (focus)="updateReaderAlignment(descriptionTrigger)"
      [innerHTML]="viewConfig.highlightDescriptionKeywords
        ? (data.description | descriptionKeywordHighlight)
        : data.description"
    ></mat-card-subtitle>
    @if (shouldClampDescription) {
      <span
        class="module-description-reader"
        [class.module-description-reader--align-end]="readerAlignEnd"
        aria-hidden="true"
        [innerHTML]="viewConfig.highlightDescriptionKeywords
          ? (data.description | descriptionKeywordHighlight)
          : data.description"
      ></span>
    }
    @if (viewConfig.showDescriptionAnalysis || viewConfig.showFrequencyAnalysis) {
      <app-module-description-analysis-suite
        class="module-description-analysis"
        [description]="data.description"
        [showDescriptionAnalysis]="viewConfig.showDescriptionAnalysis ?? false"
        [showFrequencyAnalysis]="viewConfig.showFrequencyAnalysis ?? false"
      ></app-module-description-analysis-suite>
    }
  </div>
}
