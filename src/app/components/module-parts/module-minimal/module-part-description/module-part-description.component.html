@if (data.description) {
  <div class="row space-between description"
       fxLayoutGap="1rem"
  >
    <mat-card-subtitle>
      @if (viewConfig.ellipseDescription) {
        {{ data.description|ellipsis:144 }}
      }
      @if (!viewConfig.ellipseDescription) {
        {{ data.description }}
      }
    </mat-card-subtitle>
  </div>
}
