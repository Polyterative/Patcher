@if (containImage) {
  <div fxLayoutAlign="center center"
       [routerLink]="['/modules/details',data.id]"
       class="clickable modulePartImageHost"
  >
    @if ({
      height: data.standard|getModuleHeightForStandard
    }; as bag) {
      @if (filename) {
        <img
          class="img image-transition"
          [class.img--fixed-height]="fixedHeight"
          [ngStyle]="fixedHeight ? {} : {maxHeight:32/sizeDivider+'rem'}"
          [src]="'https://sozmatmywjpstwidzlss.supabase.co/storage/v1/object/public/module-panels/'+filename"
          [@enter]
          loading="lazy"
          [alt]="'Panel image for '+data.name"
        >
      }
      @if (!filename) {
        <lib-screen-wrapper
          class="img"
          [class.img--fixed-height]="fixedHeight"
          [@enter]
        >
          <div [fxFlex]="data.hp/sizeDivider/2+'rem'"
               [ngStyle]="fixedHeight ? {} : {height:((bag.height)/sizeDivider/2+'rem')}"
               class="preview img"
               [class.preview--fixed-height]="fixedHeight"
          >
          </div>
        </lib-screen-wrapper>
      }
    }
  </div>
} @else {
  <div [routerLink]="['/modules/details',data.id]"
       class="clickable modulePartImageHost modulePartImageHost--surface"
  >
    @if ({
      height: data.standard|getModuleHeightForStandard
    }; as bag) {
      @if (filename) {
        <img
          class="image-transition modulePartImageHost__surfaceImage"
          [class.img--fixed-height]="fixedHeight"
          [ngStyle]="fixedHeight ? {} : {maxHeight:((bag.height)+'rem')}"
          [src]="'https://sozmatmywjpstwidzlss.supabase.co/storage/v1/object/public/module-panels/'+filename"
          [@enter]
          loading="lazy"
          [alt]="'Panel image for '+data.name"
        >
      }
    }
  </div>
}
