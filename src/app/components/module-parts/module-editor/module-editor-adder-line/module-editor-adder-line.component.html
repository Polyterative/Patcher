<div class="rowwrap gap1 cv-adder-line">
  <button mat-raised-button
          color="primary"
          type="button"
          class="cv-adder-button"
          [matMenuTriggerFor]="presetMenu"
          aria-label="Add CV from preset"
  >
    <mat-icon>playlist_add</mat-icon>
    Add CV
  </button>

  <mat-menu #presetMenu="matMenu">
    @for (preset of presets; track preset.label) {
      <button mat-menu-item
              type="button"
              (click)="addPreset(preset)"
      >
        @if (preset.min !== undefined && preset.max !== undefined) {
          <mat-icon>tune</mat-icon>
          <span>{{ preset.label }}</span>
        } @else {
          <mat-icon>add</mat-icon>
          <span>{{ preset.label }}</span>
        }
      </button>
    }
  </mat-menu>

  <mat-card-subtitle class="cv-adder-hint">
    Pick a preset, then adjust name and voltage values.
  </mat-card-subtitle>
</div>
