@if (!!item) {
  <div class="rowwrap gap1"
  >
    <div>
      <button mat-icon-button
              [disabled]="!(item.id==0)"
              (click)="removeRequest$.next()"
              class="danger-action"
      >
        @if (item.isApproved !== undefined && item.isApproved) {
          <mat-icon>check</mat-icon>
        } @else {
          <mat-icon class="danger-action">
            delete
          </mat-icon>
        }
      </button>
    </div>
    <lib-mat-form-entity [type]="types.TEXT"
                         [control]="item.name"
                         label="name"
                         iconL1="label"
    ></lib-mat-form-entity>
    <lib-mat-form-entity [type]="types.NUMBER"
                         [control]="item.a"
                         label="Minimum Voltage (V)"
                         iconL1="remove"
    ></lib-mat-form-entity>
    <lib-mat-form-entity [type]="types.NUMBER"
                         [control]="item.b"
                         label="Maximum Voltage (V)"
                         iconL1="add"
    ></lib-mat-form-entity>
    <mat-divider inset="true"></mat-divider>
  </div>
}
