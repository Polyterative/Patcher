@if (data && data.length > 0) {
  <div class="col gap1 ">
    @for (item of data; track item.id; let i = $index) {
      <app-comments-item [data]="item"
                         [viewConfig]="viewConfig"
      >
      </app-comments-item>
    }
  </div>
} @else {
  <div class="col gap1 animate-fadein-slowest"
  >
    <mat-card-subtitle
      style="padding: 1rem"
    >No comments yet.
    </mat-card-subtitle>
  </div>
}
