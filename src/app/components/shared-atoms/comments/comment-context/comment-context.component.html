@if ({contextInformation: contextInformation$ | async}; as bag) {
  @if (bag.contextInformation) {
    <button class="context-nav" (click)="openURL()">
      <span class="entity-label">{{ bag.contextInformation.entityLabel }}</span>
      <span class="entity-name">{{ bag.contextInformation.description }}</span>
      <mat-icon class="nav-arrow">arrow_forward</mat-icon>
    </button>
  }
}
