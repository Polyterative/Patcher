<div class="col gap1"
>
  <h1 mat-dialog-title>Create new patch</h1>
  
  <mat-dialog-content>
    <div class="col gap1">
      <p style="font-size: 1rem">
        A patch is a collection of modules and their connections.
      </p>
      <p style="font-size: 1rem">
        You can always edit the patch name and add modules later.
      </p>
      <lib-mat-form-entity [type]="fields.name.type"
                           [control]="fields.name.control"
                           [label]="fields.name.label"
                           [hint]="(fields.name.control.value?.length || 0) + '/32'"
                           iconL1="label"
      >
      </lib-mat-form-entity>
      
      <app-lib-showcase-grid [data]="[
        {
          label: 'Document Signal Flow',
          value: 'Create connections between modules to document your signal flow',
          icon: 'account_tree',
          size: 'auto'
        },
        {
          label: 'Share Your Work',
          value: 'Share your patches publicly or keep them private',
          icon: 'share',
          size: 'auto'
        },
        {
          label: 'Remember Your Ideas',
          value: 'Add notes and descriptions to remember your creative ideas',
          icon: 'lightbulb',
          size: 'auto'
        }
      ]"></app-lib-showcase-grid>
      <!--          <lib-mat-form-entity fxFlex="100"-->
      <!--                               [type]="fields.hp.type"-->
      <!--                               [control]="fields.hp.control"-->
      <!--                               [label]="fields.hp.label"-->
      <!--          >-->
      <!--          </lib-mat-form-entity>-->
      <!--          <lib-mat-form-entity fxFlex="100"-->
      <!--                               [type]="fields.rows.type"-->
      <!--                               [control]="fields.rows.control"-->
      <!--                               [label]="fields.rows.label"-->
      <!--          >-->
      <!--          </lib-mat-form-entity>-->
    </div>
  </mat-dialog-content>
  <mat-dialog-actions style="border-top: 0.5rem solid rgba(13,112,35,0.4)">
    <div class="col gap1" style="width:100%">
      <div class="row gap1" style="align-items:center">
        <mat-icon style="font-size:18px;width:18px;height:18px;line-height:18px;opacity:0.7">
          {{fields.public.control.value ? 'public' : 'lock'}}
        </mat-icon>
        <span style="font-size:0.9rem;flex:1">
          {{fields.public.control.value ? 'Public — visible to everyone' : 'Private — only visible to you'}}
        </span>
        <mat-slide-toggle [formControl]="fields.public.control" color="primary"></mat-slide-toggle>
      </div>
      <div fxFlex
           fxLayout="row"
           fxLayoutGap="2rem"
           fxLayoutGap.xs="0rem"
      >
        <div fxFlex="grow"></div>
        <app-brand-primary-button
          theme="positive"
          icon="add"
          (click$)="save$.next()"
        >
          Create
        </app-brand-primary-button>
      </div>
    </div>
  
  </mat-dialog-actions>
</div>
