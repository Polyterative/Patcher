<div class="col gap1"
>
  <h1 mat-dialog-title>Create new rack</h1>
  
  <mat-dialog-content>
    <div class="col gap1">
      <p style="font-size: 1rem">
        A rack is a virtual case where you can organize your modules.
      </p>
      <p style="font-size: 1rem">
        You can always edit the rack name and number of rows later.
      </p>
      <lib-mat-form-entity [type]="fields.name.type"
                           [control]="fields.name.control"
                           [label]="fields.name.label"
                           [hint]="(fields.name.control.value?.length || 0) + '/32'"
                           iconL1="label"
      >
      </lib-mat-form-entity>
      
      <lib-mat-form-entity [type]="fields.hp.type"
                           [control]="fields.hp.control"
                           [label]="fields.hp.label"
                           [hint]="'Range: 2-216 HP'"
                           iconL1="straighten"
      >
      </lib-mat-form-entity>
      
      <lib-mat-form-entity [type]="fields.rows.type"
                           [control]="fields.rows.control"
                           [label]="fields.rows.label"
                           [hint]="'Range: 1-10 rows'"
                           iconL1="view_comfy"
      >
      </lib-mat-form-entity>
      
      <ng-container *ngIf="rackAnalysis$ | async as analysis">
        <ng-container *ngIf="analysis.primaryStandard">
          <app-lib-showcase-grid
            [data]="[
              {
                label: 'Total Modules',
                value: 'You have ' + analysis.moduleCount + ' module' + (analysis.moduleCount !== 1 ? 's' : '') + ' in your collection',
                icon: 'inventory_2',
                size: 'auto'
              },
              {
                label: 'Largest Module',
                value: analysis.primaryStandard.largestModuleHp + ' HP (' + analysis.primaryStandard.standardName + ')',
                icon: 'straighten',
                size: 'auto'
              },
              {
                label: 'Recommended Row Size',
                value: 'Make sure your rows are at least ' + analysis.primaryStandard.largestModuleHp + ' HP to fit your largest module',
                icon: 'info',
                size: 'auto'
              }
            ]"
          ></app-lib-showcase-grid>
        </ng-container>
      </ng-container>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions style="border-top: 0.5rem solid rgba(13,112,35,0.4)">
    <div fxFlex
         fxLayout="row"
         fxLayoutGap="2rem"
         fxLayoutGap.xs="0rem"
    >
      <div fxFlex="grow"></div>
      <app-brand-primary-button
          theme="positive"
          icon="add"
          (click$)="save$.next()"
          [disabled]="!formGroup.valid"
      >
        Create
      </app-brand-primary-button>
    </div>
  
  </mat-dialog-actions>
</div>
