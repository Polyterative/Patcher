<div class="col root">
  <div class="row gap0 col-lt-MD"
  >
    <app-module-minimal [data]="data.a.module"
                        [viewConfig]="viewConfig"
                        [nameSuffix]="data.instance_id_a != null ? instanceLabelMap.get(data.instance_id_a) : undefined"
                        class="module"
    >
      <mat-chip-listbox>
        <app-module-cvitem [data]="data.a"
                           kind="out"
        ></app-module-cvitem>
      </mat-chip-listbox>
    </app-module-minimal>
    <app-patch-connection-symbol></app-patch-connection-symbol>
    <app-module-minimal [data]="data.b.module"
                        [viewConfig]="viewConfig"
                        [nameSuffix]="data.instance_id_b != null ? instanceLabelMap.get(data.instance_id_b) : undefined"
                        class="module"
    >
      <mat-chip-listbox>
        <app-module-cvitem [data]="data.b"
                           kind="in"
        ></app-module-cvitem>
      </mat-chip-listbox>
    </app-module-minimal>
  </div>
  
  @if (!isEditing) {
    <div class="row gap0 padT0"
    >
      @if (data.notes && data.notes.length > 0) {
        <div class="notes">
          {{ data.notes }}
        </div>
      }
      <div style="flex-grow: 1">
        <ng-container *ngTemplateOutlet="ordinal"></ng-container>
      </div>
    </div>
  }
  @if (isEditing) {
    <div class="row gap0 padT0 space-between parent editing-row">
      <div class="row gap0 action-icons">
        <button mat-icon-button
                [matTooltip]="isCreator?'Clear selection':'Remove connection'"
                (click)="remove$.next(data)"
                class="transparentize-quarter opacizeOnHover danger-action"
        >
          <mat-icon>delete</mat-icon>
        </button>
        @if (!isCreator && !showNotes) {
          <button mat-icon-button
                  matTooltip="Add note"
                  (click)="showNoteInput()"
                  class="transparentize-quarter opacizeOnHover"
          >
            <mat-icon>note_add</mat-icon>
          </button>
        }
      </div>
      @if (!isCreator && showNotes) {
        <lib-mat-form-entity class="note-inline"
                             [type]="types.AREA"
                             [control]="notes.control"
                             label="Notes"
                             [disabled]="!isEditing"
                             [hint]="notes.control.value.length>900?notes.control.value.length+'/999':undefined"
                             [ngClass]="{'padT0':notes.control.value.length>0}"
                             iconL1="note"
                             (focusout)="onNoteBlur()"
        ></lib-mat-form-entity>
      }
      @if (isCreator) {
        <app-brand-primary-button
          (click$)="create$.next(data)"
        >
          Confirm connection
        </app-brand-primary-button>
      }
      <ng-container *ngTemplateOutlet="ordinal"></ng-container>
    </div>
  }
  
  <ng-template #ordinal>
    @if (index) {
      <mat-card-subtitle
        fxLayoutAlign="end center"
        class="monospace"
        [ngClass]="index%5!=0?'fade-ordinal':''"
      >#{{ index }}
      </mat-card-subtitle>
    }
  </ng-template>
  <ng-template #notesT>
  </ng-template>
</div>
