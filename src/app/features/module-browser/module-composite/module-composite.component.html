<app-module-minimal [data]="data"
                    [viewConfig]="viewConfig"
                    [nameSuffix]="nameSuffix"
                    [preferredPanelColor]="preferredPanelColor"
                    [portraitDetailSplit]="shouldUsePortraitDetailSplit"
                    [showCoolAction]="showCoolAction"
                    [priceSummary]="priceSummary"
                    [priceHistorySummary]="priceHistorySummary"
                    (coolToggled)="coolToggled.emit($event)"
>
  <app-module-details [data]="data"
                      [viewConfig]="viewConfig"
                      [instanceId]="instanceId"
  ></app-module-details>
</app-module-minimal>
