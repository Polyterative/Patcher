<div class="col gap1"
>
  <lib-hero-content-card titleBig="Modules"
                         class="modulesBG"
                         description="Browse and discover modules, save your favourites and submit your own"
  >
    <div class="sidebar-layout">
      
      <!-- ── Left sidebar: all filters ── -->
      <aside class="filter-sidebar col gap1"
             [class.module-filter-sidebar--expanded]="mobileFiltersExpanded"
      >
        
        <span class="filter-sidebar__heading">Filters</span>
        
        <div class="module-filter-control">
          <lib-mat-form-entity [control]="dataService.fields.name.control"
                               [type]="dataService.fields.name.type"
                               [label]="dataService.fields.name.label"
                               iconL1="search"
          ></lib-mat-form-entity>
        </div>
        
        <div class="module-filter-control">
          <lib-mat-form-entity [control]="dataService.fields.description.control"
                               [type]="dataService.fields.description.type"
                               [label]="dataService.fields.description.label"
                               iconL1="description"
          ></lib-mat-form-entity>
        </div>
        
        <button mat-button
                type="button"
                class="module-filter-toggle"
                (click)="toggleMobileFilters()"
                [attr.aria-expanded]="mobileFiltersExpanded"
                aria-controls="module-filter-advanced-controls"
        >
          <mat-icon>{{ mobileFiltersExpanded ? 'expand_less' : 'expand_more' }}</mat-icon>
          {{ mobileFiltersExpanded ? 'Show fewer filters' : 'Show more filters' }}
        </button>
        
        <div id="module-filter-advanced-controls"
             class="module-filter-control module-filter-control--optional"
        >
          <lib-mat-form-entity [control]="dataService.fields.manufacturers.control"
                               [type]="dataService.fields.manufacturers.type"
                               [options$]="dataService.fields.manufacturers.options$"
                               [label]="dataService.fields.manufacturers.label"
                               [disableVoidSelection]="false"
                               [autocompleteCanBeVoid]="true"
                               iconL1="handyman"
          ></lib-mat-form-entity>
        </div>
        
        <div class="module-filter-control module-filter-control--optional">
          <lib-mat-form-entity [control]="dataService.fields.hpCondition.control"
                               [type]="dataService.fields.hpCondition.type"
                               [label]="dataService.fields.hpCondition.label"
                               [options$]="dataService.fields.hpCondition.options$"
                               [disableVoidSelection]="false"
                               iconL1="compare_arrows"
          ></lib-mat-form-entity>
        </div>
        
        <div class="module-filter-control module-filter-control--optional">
          <lib-mat-form-entity [control]="dataService.fields.hp.control"
                               [type]="dataService.fields.hp.type"
                               [label]="dataService.fields.hp.label"
                               iconL1="straighten"
          ></lib-mat-form-entity>
        </div>
        
        <div class="module-filter-control module-filter-control--optional">
          <lib-mat-form-entity [control]="dataService.fields.standard.control"
                               [type]="dataService.fields.standard.type"
                               [options$]="dataService.fields.standard.options$"
                               [disableVoidSelection]="true"
                               [label]="dataService.fields.standard.label"
                               iconL1="settings"
          ></lib-mat-form-entity>
        </div>
        
        <div class="module-filter-control module-filter-control--optional">
          <lib-mat-form-entity [control]="dataService.fields.tags.control"
                               [type]="dataService.fields.tags.type"
                               [options$]="dataService.fields.tags.options$"
                               [label]="dataService.fields.tags.label"
                               iconL1="label"
          ></lib-mat-form-entity>
        </div>
        
        <div class="module-filter-control module-filter-control--optional">
          <lib-mat-form-entity [control]="dataService.fields.order.control"
                               [options$]="dataService.fields.order.options$"
                               [type]="dataService.fields.order.type"
                               [disableVoidSelection]="true"
                               [label]="dataService.fields.order.label"
                               iconL1="sort"
          ></lib-mat-form-entity>
        </div>
        
        <div class="col gap1">
          <button mat-stroked-button
                  (click)="dataService.resetForm$.next()"
                  [disabled]="!(dataService.canReset$ | async)"
                  [matTooltip]="'Reset all filters'"
          >
            <mat-icon>refresh</mat-icon>
            Reset filters
          </button>
        </div>
        
        <app-recent-activity class="module-recent-activity"
                             [items]="recentActivityItems$ | async"
                             title="Recent activity"
                             emptyText="No recent module activity in this filtered set."
        ></app-recent-activity>
      
      </aside>
      
      <!-- ── Right column: results ── -->
      <div class="browser-content-area col gap1">
        <app-module-list [data$]="dataService.modulesList$"
                         [viewConfig]="viewConfig"
                         [encloseVertically]="false"
        ></app-module-list>
        <mat-paginator [hidePageSize]="(dataService.serversideAdditionalData.itemsCount$|async)<20"
                       [pageSizeOptions]="[20,25,50,100]"
                       [pageSize]="dataService.serversideTableRequestData.take$.value"
                       [pageIndex]="dataService.serversideTableRequestData.skip$.value / dataService.serversideTableRequestData.take$.value"
                       [length]="dataService.serversideAdditionalData.itemsCount$|async"
                       (page)="dataService.pageEvent$.next($event)"
                       showFirstLastButtons
        ></mat-paginator>
        <lib-auto-update-loading-indicator [data$]="dataService.modulesList$"
                                           [updateData$]="dataService.updateModulesList$"
        ></lib-auto-update-loading-indicator>
      </div>
    
    </div>
  </lib-hero-content-card>
  
  @if (showSubmitFab) {
    <a
      mat-fab
      extended
      class="module-browser-submit-fab"
      routerLink="/modules/add"
      matTooltip="Open the module submission form to add a new module to the database"
      matTooltipPosition="above"
    >
      <mat-icon>add</mat-icon>
      Submit a new module
    </a>
  }
</div>
