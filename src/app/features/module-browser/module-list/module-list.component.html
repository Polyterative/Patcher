@if ({
  filteredData:(filteredData$|async),
  data:(data$|async)
}; as bag) {
  @if (bag.data == null) {
    <lib-auto-content-loading-indicator
      [skipFirstData]="true"
      [loadingLines]="5"
    >
    </lib-auto-content-loading-indicator>
  } @else {
    <div class="col gap1">
      @if (showSearch || showOrder) {
        <div class="row gap1">
          @if (showSearch) {
            <app-local-data-filter></app-local-data-filter>
          }
          @if (showOrder) {
            <lib-mat-form-entity
              [control]="sortControl"
              [type]="formTypes.SELECT"
              [options$]="sortOptions$"
              [disableVoidSelection]="true"
              [formFieldAppearanceType]="'outline'"
              iconL1="sort"
              label="Sort"
            ></lib-mat-form-entity>
            <lib-mat-form-entity
              [control]="groupControl"
              [type]="formTypes.SELECT"
              [options$]="groupOptions$"
              [disableVoidSelection]="true"
              [formFieldAppearanceType]="'outline'"
              iconL1="view_stream"
              label="Group"
            ></lib-mat-form-entity>
          }
        </div>
      }
      <flexbox-row-fast
        [ngClass]="{'limit-height':encloseVertically}"
      >
        @for (item of bag.filteredData; track item; let i = $index) {
          <lib-clean-card [@enter]="{ value: '', params: { delay: (i * 25)+50}}"
                          [@leave]="{ value: '', params: { delay:  0 }}"
          >
            <app-module-minimal
              [data]="item"
              [viewConfig]="viewConfig"
              [preferredPanelColor]="appState.preferredPanelColor$ | async"
            ></app-module-minimal>
          </lib-clean-card>
        } @empty {
          <app-empty-state></app-empty-state>
        }
      </flexbox-row-fast>
    </div>
  }
}
