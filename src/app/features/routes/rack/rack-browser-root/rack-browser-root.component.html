<div class="col gap1"
>
  <lib-hero-content-card titleBig="Racks"
                         class="racksBG"
                         [showWideShellNav]="true"
  >
    <div class="sidebar-layout">
      
      <!-- ── Left sidebar: all filters ── -->
      <aside class="filter-sidebar col gap1">
        
        <span class="filter-sidebar__heading">Filters</span>
        
        <lib-mat-form-entity [control]="dataService.fields.search.control"
                             [type]="formTypes.TEXT"
                             [label]="dataService.fields.search.label"
                             iconL1="search"
        ></lib-mat-form-entity>

        <lib-mat-form-entity [control]="dataService.fields.order.control"
                             [options$]="dataService.fields.order.options$"
                             [type]="formTypes.SELECT"
                             [disableVoidSelection]="true"
                             [label]="dataService.fields.order.label"
                             iconL1="sort"
        ></lib-mat-form-entity>
        
        <div class="col gap1">
          <app-browser-reset-filters-button
            [canReset$]="dataService.canReset$"
            (reset$)="dataService.resetForm$.next()"
          ></app-browser-reset-filters-button>
        </div>
      
      </aside>
      
      <!-- ── Right column: results ── -->
      <div class="browser-content-area col gap1">
        <app-rack-list [data$]="dataService.racksList$"
                       [viewConfig]="viewConfig"
        ></app-rack-list>
        @if (dataService.hasMoreRacks$ | async) {
          <div class="loadMore">
            <button mat-stroked-button
                    class="loadMore__btn"
                    (click)="dataService.loadMore$.next()"
            >Load more
              <span class="loadMore__count">{{ dataService.remainingRacksCount$ | async }} remaining</span>
            </button>
          </div>
        }
        <lib-auto-update-loading-indicator [data$]="dataService.racksList$"
                                           [updateData$]="dataService.updateRacksList$"
        ></lib-auto-update-loading-indicator>
      </div>
    
    </div>
  </lib-hero-content-card>
</div>
