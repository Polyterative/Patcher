@if ({
  userProfile: (userService.loggedUserFullProfile$|async),
  globalSearchQuery: (globalSearchQuery$|async)
}; as bag) {
  <lib-screen-wrapper maxSize="130rem">
    @if (bag.userProfile) {
      <lib-clean-card appDiscoveryTipAnchor="user-area-profile-card"
                      style="max-width: 26rem;min-width:18rem">
        <app-label-value-showcase label="User"
        >{{ bag.userProfile.username }}
        </app-label-value-showcase>
        <!-- TODO: Panel preference (light/dark/none) is a planned feature but not yet fully implemented.
             Commented out to prevent the raw toggle from appearing in the user profile area.
             Re-enable and complete the feature (backend persistence, UX polish) before shipping.
        <div class="row gap1" style="align-items: center; margin-top: 0.5rem;">
          <span style="font-size: 0.85rem; white-space: nowrap;">Panel preference</span>
          <mat-button-toggle-group
            [value]="appState.preferredPanelColor$ | async"
            (change)="appState.setPreferredPanelColor($event.value)"
          >
            <mat-button-toggle [value]="1">Light</mat-button-toggle>
            <mat-button-toggle [value]="2">Dark</mat-button-toggle>
            <mat-button-toggle [value]="null">None</mat-button-toggle>
          </mat-button-toggle-group>
        </div>
        -->
      </lib-clean-card>
    }
    <div class="col gap1"
    >
      <div class="profile-layout">
        <div class="container gap1 main-content"
        >
          <app-user-modules appDiscoveryTipAnchor="user-area-modules-section"
                            class="block"
                            [modulesViewConfig]="viewConfig"
                            [encloseVertically]="true"
                            [globalSearchQuery]="bag.globalSearchQuery ?? ''"
          ></app-user-modules>
          <app-user-racks appDiscoveryTipAnchor="user-area-racks-section"
                          class="block"
                          [globalSearchQuery]="bag.globalSearchQuery ?? ''"
          ></app-user-racks>
          <app-user-patches appDiscoveryTipAnchor="user-area-patches-section"
                            class="block"
                            [globalSearchQuery]="bag.globalSearchQuery ?? ''"
          ></app-user-patches>
        </div>
        <div class="sidebar col gap1">
          <app-statistics appDiscoveryTipAnchor="user-area-stats"
            title="Profile stats"
            icon="analytics"
            cardClass="userBG"
            [statistics]="miscStats$ | async"
          ></app-statistics>
          <div appDiscoveryTipAnchor="user-area-manuals">
            <app-user-manuals></app-user-manuals>
          </div>
          <div appDiscoveryTipAnchor="user-area-comments">
            <app-user-comments></app-user-comments>
          </div>
        </div>
      </div>
    </div>
    
    <div appDiscoveryTipAnchor="user-area-search"
         class="user-area-floating-search">
      <lib-mat-form-entity [control]="globalSearchControl"
                           [type]="formTypes.TEXT"
                           label="Search modules, racks, patches"
                           [formFieldAppearanceType]="'outline'"
      ></lib-mat-form-entity>
    </div>
  </lib-screen-wrapper>
}
