<div class="col gap1"
>
  <lib-hero-content-card titleNormal="Racks"
                         description="Keep track of your racks, check if your modules fit, and share them with your friends"
                         class="racksBG"
                         icon="view_stream"
                         id="racks"
  >
    <div class="col gap1 section-shell"
    >
      <div class="row gap1 auto-left section-actions">
        <app-brand-primary-button appDiscoveryTipAnchor="user-area-racks-create"
                                  (click$)="dataService.addRack$.next()"
                                  icon="add"
        >Create rack
        </app-brand-primary-button>
      </div>
      <mat-divider inset="true"></mat-divider>
      @if ((dataService.pagedRacksData$|async); as data) {
        @if (data.length > 0) {
          <div class="section-scroll">
            <app-rack-list class="section-list"
                           [data$]="dataService.pagedRacksData$"
                           [showSearch]="false"
                           [viewConfig]="rackMinimalViewConfig"
            ></app-rack-list>
          </div>
        } @else {
          <div class="section-empty">
            @if (globalSearchQuery.trim()) {
              <app-empty-state-tips
                [compact]="true"
                icon="search_off"
                title="No matches"
                [copy]="'No racks match &quot;<strong>' + globalSearchQuery.trim() + '</strong>&quot;.'"
              ></app-empty-state-tips>
            } @else {
              <app-empty-state-tips
                icon="view_stream"
                title="Plan your first rack"
                copy="Racks let you lay out modules, check if they fit, and share the build with friends."
                [tips]="[
                  { icon: 'add', html: 'Click <strong>Create rack</strong>, then drag modules in from your collection or the library.' }
                ]"
              ></app-empty-state-tips>
            }
          </div>
        }
      }
      
      @if ((dataService.filteredRacksCount$ | async) > dataService.racksPagination.take$.value) {
        <mat-paginator
          [pageSize]="dataService.racksPagination.take$.value"
          [pageSizeOptions]="[10, 20, 50]"
          [length]="dataService.filteredRacksCount$ | async"
          (page)="dataService.racksPageEvent$.next($event)"
          showFirstLastButtons
        ></mat-paginator>
      }
      <lib-auto-update-loading-indicator [data$]="dataService.rackData$"
                                         [updateData$]="dataService.updateRackData$"
      ></lib-auto-update-loading-indicator>
    </div>
  </lib-hero-content-card>

</div>
