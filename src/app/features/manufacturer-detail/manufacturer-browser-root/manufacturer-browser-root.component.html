<div class="col gap1">
  <lib-hero-content-card
    titleBig="Manufacturers"
    class="manufacturersBG"
    [showWideShellNav]="true"
    description="Browse and discover manufacturers, explore their catalogues and find your next obsession"
  >
    <div class="sidebar-layout">
      
      <!-- ── Left sidebar: filters ── -->
      <aside class="filter-sidebar col gap1">
        <span class="filter-sidebar__heading">Filters</span>
        
        <lib-mat-form-entity
          [control]="dataService.fields.search.control"
          [type]="formTypes.TEXT"
          [label]="dataService.fields.search.label"
          iconL1="search"
        ></lib-mat-form-entity>
        
        <lib-mat-form-entity
          [control]="dataService.fields.order.control"
          [options$]="dataService.fields.order.options$"
          [type]="formTypes.SELECT"
          [disableVoidSelection]="true"
          [label]="dataService.fields.order.label"
          iconL1="sort"
        ></lib-mat-form-entity>
        
        <div class="col gap1">
          <button mat-stroked-button
                  (click)="dataService.resetForm$.next()"
                  [disabled]="!(dataService.canReset$ | async)"
                  matTooltip="Reset all filters"
          >
            <mat-icon>refresh</mat-icon>
            Reset filters
          </button>
        </div>
      </aside>
      
      <!-- ── Right column: results ── -->
      <div class="browser-content-area col gap1">
        @if (dataService.manufacturers$ | async; as manufacturers) {
          @if (manufacturers == null) {
            <lib-auto-content-loading-indicator
              [skipFirstData]="true"
              [loadingLines]="5"
            >
            </lib-auto-content-loading-indicator>
          } @else {
            @if (manufacturers.length > 0) {
              <div class="manufacturer-list">
                @for (manufacturer of manufacturers; track manufacturer.id) {
                  <app-manufacturer-row [manufacturer]="manufacturer"></app-manufacturer-row>
                } @empty {
                  <app-empty-state></app-empty-state>
                }
              </div>
            } @else {
              <app-empty-state></app-empty-state>
            }
          }
          <mat-paginator
            [hidePageSize]="(dataService.serversideAdditionalData.itemsCount$ | async) < 10"
            [pageSize]="dataService.serversideTableRequestData.take$.value"
            [pageIndex]="dataService.serversideTableRequestData.skip$.value / dataService.serversideTableRequestData.take$.value"
            [pageSizeOptions]="[10, 20, 50]"
            [length]="dataService.serversideAdditionalData.itemsCount$ | async"
            (page)="dataService.pageEvent$.next($event)"
            showFirstLastButtons
          ></mat-paginator>
        }
        <lib-auto-update-loading-indicator
          [data$]="dataService.manufacturers$"
          [updateData$]="dataService.updateList$"
        ></lib-auto-update-loading-indicator>
      </div>
    
    </div>
  </lib-hero-content-card>
</div>
