<a class="manufacturer-row-header"
   [routerLink]="['/manufacturers/details', manufacturer.id]"
>
  @if (manufacturer.logo) {
    <img
      class="manufacturer-row-logo"
      [src]="'https://sozmatmywjpstwidzlss.supabase.co/storage/v1/object/public/manufacturer-logos/' + manufacturer.logo"
      [alt]="manufacturer.name + ' logo'"
      loading="lazy"
    />
  } @else {
    <div class="manufacturer-row-logo-placeholder">
      <mat-icon>business</mat-icon>
    </div>
  }
  <span class="manufacturer-row-name">{{ manufacturer.name }}</span>
  <mat-icon class="manufacturer-row-chevron">chevron_right</mat-icon>
</a>

@if (modules$ | async; as modules) {
  @if (modules.length === 0) {
    <span class="manufacturer-row-empty">No modules yet</span>
  } @else {
    <div class="manufacturer-row-modules">
      <div class="module-strip">
        @for (module of modules; track module.id) {
          <lib-clean-card class="module-strip-card">
            <app-module-minimal
              [data]="module"
              [viewConfig]="moduleViewConfig"
            ></app-module-minimal>
          </lib-clean-card>
        }
      </div>
    </div>
  }
} @else {
  <lib-auto-content-loading-indicator [loadingLines]="1" [skipFirstData]="true">
  </lib-auto-content-loading-indicator>
}
