<div class="metric-bar"
     role="img"
     [attr.aria-label]="label + ': ' + valueLabel + (detail ? '. ' + detail : '')">
  <div class="metric-bar__heading">
    <span>{{ label }}</span>
    <strong>{{ valueLabel }}</strong>
  </div>
  <div class="metric-bar__track" aria-hidden="true">
    <div
      class="metric-bar__fill"
      [ngClass]="'metric-bar__fill--' + tone"
      [style.width.%]="widthPercent"
    ></div>
  </div>
  <p>{{ detail }}</p>
</div>
