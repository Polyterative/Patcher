<section class="hero" aria-labelledby="home-hero-title">
  <div class="hero__copy">
    <p class="hero__eyebrow">{{ content.eyebrow }}</p>
    <h1 id="home-hero-title" class="hero__title">{{ content.title }}</h1>
    <p class="hero__lede">{{ content.lede }}</p>

    <div class="hero__actions">
      @if (isSignedIn) {
        <app-brand-primary-button theme="solid"
                                  routerLink="/user/area"
                                  (click$)="ctaClicked.emit({cta: 'workspace', location: 'hero'})"
        >Open your workspace</app-brand-primary-button>
      } @else {
        <app-brand-primary-button theme="solid"
                                  routerLink="/auth/signup"
                                  (click$)="ctaClicked.emit({cta: 'signup', location: 'hero'})"
        >Get started free</app-brand-primary-button>
      }
      <app-brand-primary-button theme="light"
                                routerLink="/modules/browser"
                                (click$)="ctaClicked.emit({cta: 'browse_modules', location: 'hero'})"
      >Browse modules</app-brand-primary-button>
    </div>

    <div class="hero__switch">
      <span class="hero__switch-tag">New here from ModularGrid?</span>
      <app-brand-primary-button theme="light"
                                icon="south"
                                href="#switch"
                                (click)="onSwitchLinkClick($event)"
      >Bring your racks</app-brand-primary-button>
    </div>
  </div>

  <figure class="hero__panel">
    <div class="hero__panel-bar">
      @if (patchMeta$ | async; as meta) {
        <span class="hero__panel-label">Patch · {{ meta.name }}</span>
        <span class="hero__panel-stats">{{ meta.modules }} modules · {{ meta.cables }} cables</span>
      } @else {
        <span class="hero__panel-label">Patch · loading</span>
      }
    </div>
    <div class="hero__graph">
      <app-patch-graph [progressiveRender]="true"></app-patch-graph>
    </div>
    <figcaption class="hero__caption">{{ content.graphCaption }}</figcaption>
  </figure>
</section>
