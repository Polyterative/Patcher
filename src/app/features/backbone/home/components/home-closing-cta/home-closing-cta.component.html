<section class="closing" aria-labelledby="home-closing-title">
  <img class="closing__logo" src="/assets/png/LOGO_1.png" alt="" width="56" height="56" loading="lazy">
  <h2 id="home-closing-title" class="closing__title">Bring your system into Patcher.</h2>
  <p class="closing__text">It's free and runs in your browser. Look around first if you like.</p>
  <div class="closing__actions">
    @if (isSignedIn) {
      <app-brand-primary-button theme="solid"
                                routerLink="/user/area"
                                (click$)="ctaClicked.emit({cta: 'workspace', location: 'closing'})"
      >Open your workspace</app-brand-primary-button>
    } @else {
      <app-brand-primary-button theme="solid"
                                routerLink="/auth/signup"
                                (click$)="ctaClicked.emit({cta: 'signup', location: 'closing'})"
      >Get started free</app-brand-primary-button>
      <app-brand-primary-button theme="light"
                                routerLink="/auth/login"
                                (click$)="ctaClicked.emit({cta: 'login', location: 'closing'})"
      >Log in</app-brand-primary-button>
    }
    <app-brand-primary-button theme="light"
                              routerLink="/modules/browser"
                              (click$)="ctaClicked.emit({cta: 'browse_modules', location: 'closing'})"
    >Browse modules</app-brand-primary-button>
  </div>
</section>
