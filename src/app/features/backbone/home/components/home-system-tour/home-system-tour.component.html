@let active = (activeId$ | async) ?? tabs[0]?.id;

<div class="tour">
  <app-segmented-control class="tour__tabs"
                         kind="tabs"
                         size="large"
                         idPrefix="home-tour"
                         ariaLabel="What Patcher keeps track of"
                         [options]="tabOptions"
                         [value]="active"
                         (valueChange)="select($event)"
  ></app-segmented-control>

  @for (tab of tabs; track tab.id) {
    <div class="tour__panel"
         role="tabpanel"
         [id]="'home-tour-panel-' + tab.id"
         [attr.aria-labelledby]="'home-tour-tab-' + tab.id"
         [hidden]="tab.id !== active">
      <div class="tour__copy">
        <h3 class="tour__title">{{ tab.title }}</h3>
        <p class="tour__description">{{ tab.description }}</p>
        <ul class="tour__points">
          @for (point of tab.points; track point) {
            <li>{{ point }}</li>
          }
        </ul>
        <app-brand-primary-button class="tour__link"
                                  theme="light"
                                  [routerLink]="tab.link.href"
                                  (click$)="ctaClicked.emit({cta: 'tour_' + tab.id, location: 'tour'})"
        >{{ tab.link.label }}</app-brand-primary-button>
      </div>
      <div class="tour__shot">
        <img class="tour__img tour__img--light"
             [src]="tab.shot.light"
             [alt]="tab.shot.alt"
             width="1600"
             height="1000"
             loading="lazy"
             decoding="async">
        <img class="tour__img tour__img--dark"
             [src]="tab.shot.dark"
             [alt]="tab.shot.alt"
             width="1600"
             height="1000"
             loading="lazy"
             decoding="async">
      </div>
    </div>
  }
</div>
