<div class="proof">
  <dl class="proof__figures">
    @for (figure of figures; track figure.label) {
      <div class="proof__figure">
        <dt class="proof__label">{{ figure.label }}</dt>
        <dd class="proof__value">{{ figure.value }}</dd>
      </div>
    }
    <div class="proof__figure">
      <dt class="proof__label">to use every feature</dt>
      <dd class="proof__value">€0</dd>
    </div>
  </dl>
  <a class="proof__link"
     routerLink="/info/insights"
     (click)="ctaClicked.emit({cta: 'insights', location: 'proof'})">
    Live community insights
    <mat-icon aria-hidden="true">arrow_forward</mat-icon>
  </a>
</div>
