<lib-screen-wrapper maxSize="86rem">
  <main class="home-page">
    <section class="section-enter">
      <app-home-experience-hero [content]="heroContent">
        <div hero-actions class="hero-action-stack">
          <app-brand-primary-button routerLink="/auth/signup" icon="person_add">Create an account
          </app-brand-primary-button>
          <app-brand-primary-button routerLink="/auth/login" icon="login">Login</app-brand-primary-button>
        </div>
      </app-home-experience-hero>
    </section>
    
    <section class="proof-list section-enter" aria-label="product walkthrough">
      @for (section of proofSections; track section.title; let index = $index) {
        <app-home-proof-showcase
          [kicker]="section.kicker"
          [title]="section.title"
          [description]="section.description"
          [keywords]="section.keywords ?? []"
          [tone]="section.tone"
          [reverse]="index % 2 === 1"
        >
          <div class="frame-host">
            <lib-device-frame-wrapper>
              @switch (section.kind) {
                @case ('patch') {
                  <app-patch-browser-patch-detail
                    [ignoreSeo]="true"
                    [viewConfig]="patchViewConfig"
                  ></app-patch-browser-patch-detail>
                }
                @case ('module') {
                  <app-module-browser-detail
                    [ignoreSeo]="true"
                    [viewConfig]="moduleViewConfig"
                  ></app-module-browser-detail>
                }
                @case ('rack') {
                  <app-rack-browser-rack-detail
                    [ignoreSeo]="true"
                    [viewConfig]="rackViewConfig"
                  ></app-rack-browser-rack-detail>
                }
              }
            </lib-device-frame-wrapper>
          </div>
        </app-home-proof-showcase>
      }
    </section>
    
    <section class="bridge-row section-enter">
      <app-home-curiosity-bridge
        title="Open, free, and built for daily use"
        description="Use the same straightforward experience on desktop and mobile, with free access to public content."
        [links]="communityLinks"
      ></app-home-curiosity-bridge>
      
      <app-home-founder-note
        [stories]="userStories"
      ></app-home-founder-note>
    </section>
    
    <section class="section-enter">
      <app-home-open-principles
        sectionTitle="Why it feels easy to use"
        sectionIntro="Everything is designed to help you stay creative, stay organized, and get back to great sounds faster."
        [cards]="principleCards"
      ></app-home-open-principles>
    </section>
    
    <section class="section-enter">
      <app-home-workflow-rail
        sectionTitle="How people actually use it"
        sectionIntro="A simple loop: explore, build, organize, and return."
        [steps]="workflowSteps"
      ></app-home-workflow-rail>
    </section>
    
    <section class="section-enter">
      <app-home-invitation-cta
        title="Start building your sound library"
        description="Create an account, map your setup, and turn today's experiments into tomorrow's starting point."
        imageSrc="/assets/png/LOGO_1.png"
        imageAlt="Patcher logo"
      >
        <app-brand-primary-button routerLink="/auth/signup" icon="person_add">Create an account
        </app-brand-primary-button>
        <app-brand-primary-button routerLink="/auth/login" icon="login">Login</app-brand-primary-button>
      </app-home-invitation-cta>
    </section>
  </main>
</lib-screen-wrapper>
