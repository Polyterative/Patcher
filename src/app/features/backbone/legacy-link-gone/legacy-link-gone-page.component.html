<div style="display:flex; flex:1 1 auto; flex-direction:column; gap:2rem; align-items:center;">
  <app-empty-state style="padding-top: 8rem"
                   backgroundImage="assets/svg/404.svg"
  ></app-empty-state>

  <div class="legacy-link-gone__content"
       style="display:flex; flex-direction:column; gap:1.5rem; align-items:center;"
  >
    <mat-card-title style="display:flex; justify-content:center;">This share link has been retired.</mat-card-title>

    <p class="legacy-link-gone__copy">
      To improve privacy, we replaced numeric rack and patch links with opaque tokens. Old private
      share links no longer work — ask the owner for a new link, or visit your own racks and patches
      in your profile.
    </p>

    <div style="display:flex; flex-wrap:wrap; gap:1rem; justify-content:center; align-items:center;">
      <a mat-raised-button
         color="primary"
         routerLink="/racks/browser"
      >Browse racks</a>
      <a mat-stroked-button
         [routerLink]="profileLink$ | async"
      >My profile</a>
    </div>
  </div>
</div>
