<lib-screen-wrapper sizePreset="wide-shell"
                    class="auth-page-shell">
  <div class="auth-page-shell__inner col gap1">
    <!-- Reapply `userBG` here if we want the warmer private/auth hero gradient back. -->
    <lib-hero-content-card titleBig="We haven't been introduced yet"
                           description="Sign up to save your collection, racks, and patches in My Area. You can still browse public content without an account."
                           [showWideShellNav]="true"
                           icon="person_add"
                           class="auth-entry-card">
      <div class="col gap1">
        <div class="auth-surface">
          <div class="auth-body">
            <div class="auth-container">
              <!-- Email/Password Signup Section -->
              <section class="email-signup-section" aria-label="Email signup">
                <app-signup-email fxFlex="100"></app-signup-email>
              </section>
              
              <!-- SSO Authentication Section (temporarily hidden) -->
              <!-- <section class="sso-section" aria-label="Social signup options">
                <app-sso-buttons
                  [showDivider]="true"
                  [dividerText]="'or'"
                  (providerSelected)="handleSSOSignup($event)">
                </app-sso-buttons>
              </section> -->
              
              <!-- Alternative Actions Section -->
              <section class="alternative-actions-section" aria-label="Alternative actions">
                <div class="action-link-wrapper login-link"
                     routerLink="/auth/login">
                  <mat-card-subtitle fxLayoutAlign="center"
                                     class="action-link">
                    Already have an account? <strong>Log in</strong>
                  </mat-card-subtitle>
                </div>
              </section>
            </div>
          </div>
        </div>
      
      </div>
    </lib-hero-content-card>
  </div>
</lib-screen-wrapper>
