<lib-screen-wrapper maxSize="32rem"
                    style="margin-bottom:8rem"
>
  <div class="gradientCard col gap1"
  >
    <lib-hero-content-card titleBig="We haven't been introduced yet"
                           style="padding-bottom: 32rem;"
    >
      <div class="col gap1"
      >
        <app-signup-email fxFlex="100"></app-signup-email>
        
        <!-- SSO Authentication Options (handles both login and signup) -->
        <app-sso-buttons
          [providers]="['google', 'apple', 'github']"
          (providerSelected)="handleSSOSignup($event)">
        </app-sso-buttons>
        
        <!-- Action Links Section with improved spacing -->
        <div class="signup-actions-section">
          <div class="action-link-wrapper login-link"
               routerLink="/auth/login">
            <mat-card-subtitle fxLayoutAlign="center"
                               class="action-link">
              Login instead?
            </mat-card-subtitle>
          </div>
        </div>
      </div>
    </lib-hero-content-card>
  
  </div>
</lib-screen-wrapper>
