<div class="sso-buttons-container" role="group" [attr.aria-label]="'Social authentication options'">
  <!-- Divider with semantic meaning -->
  @if (showDivider) {
    <div class="divider" role="separator" aria-label="Alternative authentication methods">
      <span>{{ dividerText }}</span>
    </div>
  }
  
  <!-- SSO buttons grid -->
  <div class="buttons-grid">
    @for (provider of providers; track provider) {
      <button
        mat-stroked-button
        class="sso-button sso-button-{{ provider }}"
        [disabled]="isLoading"
        [attr.aria-label]="'Continue with ' + config[provider].name"
        [attr.data-provider]="provider"
        (click)="selectProvider(provider)"
        type="button"
      >
        <span class="provider-logo" aria-hidden="true">
          {{ config[provider].icon }}
        </span>
        <span class="button-text">
          {{ getButtonText(provider) }}
        </span>
        
        <!-- Loading indicator -->
        @if (isLoading && loadingProvider === provider) {
          <mat-spinner
            class="loading-spinner"
            diameter="20"
            aria-label="Loading">
          </mat-spinner>
        }
      </button>
    }
  </div>
</div>
