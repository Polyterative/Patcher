<div class="sso-buttons-container">
  @if (showDivider) {
    <div class="divider"><span>{{ dividerText }}</span></div>
  }
  
  <div class="buttons-grid">
    @for (provider of providers; track provider) {
      <button mat-stroked-button
              class="sso-button"
              [disabled]="isLoading"
              [style.border-color]="config[provider].color"
              [style.color]="config[provider].color"
              [attr.aria-label]="getAriaLabel(provider)"
              (click)="selectProvider(provider)">
        <span class="provider-logo" aria-hidden="true">{{ config[provider].icon }}</span>
        <span class="button-text">{{ getButtonText(provider) }}</span>
        @if (isLoading && loadingProvider === provider) {
          <mat-spinner diameter="20"></mat-spinner>
        }
      </button>
    }
  </div>
</div>
