<div class="col gap1">
  <lib-hero-content-card class="modulesBG"
                         titleBig="Collections"
                         description="Curated playlists of modules you can open, inspect, and share."
                         icon="playlist_play"
                         >

    <div class="sidebar-layout">

      <!-- ── Left sidebar: filters ── -->
      <aside class="filter-sidebar col gap1">
        <span class="filter-sidebar__heading">Filters</span>

        <lib-mat-form-entity [control]="dataService.fields.search.control"
                             [type]="dataService.fields.search.type"
                             [label]="dataService.fields.search.label"
                             iconL1="search"
        ></lib-mat-form-entity>

        <lib-mat-form-entity
          [control]="dataService.fields.order.control"
          [type]="dataService.fields.order.type"
          [options$]="dataService.fields.order.options$"
          [disableVoidSelection]="true"
          iconL1="sort"
          [label]="dataService.fields.order.label"
        ></lib-mat-form-entity>

        <div class="col gap1">
          <app-browser-reset-filters-button
            [canReset$]="dataService.canReset$"
            (reset$)="dataService.resetForm$.next()"
          ></app-browser-reset-filters-button>
        </div>

      </aside>

      <!-- ── Right: results ── -->
      <div class="browser-content-area">
        <app-module-collections-list
          [collections]="dataService.collections$ | async"
          [loading]="(dataService.loading$ | async) ?? false"
          [hasMore]="(dataService.hasMore$ | async) ?? false"
          [remainingCount]="(dataService.remainingCount$ | async) ?? 0"
          (loadMore)="dataService.loadMore$.next()"
        ></app-module-collections-list>
      </div>

    </div>

  </lib-hero-content-card>
</div>
