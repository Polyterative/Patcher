apiVersion: 1
datasources:
  - name: Patcher self-host DB
    uid: patcher-pg
    type: postgres
    access: proxy
    url: db:5432
    user: grafana_ro
    isDefault: true
    editable: false
    jsonData:
      database: postgres
      sslmode: disable
      postgresVersion: 1700
      maxOpenConns: 4
      maxIdleConns: 2
      connMaxLifetime: 14400
      timescaledb: false
    secureJsonData:
      password: $__file{/run/secrets/grafana_ro_password}
